---
- name: Verzeichnis /etc/rancher/k3s sicherstellen
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: k3s-Server-Config (tls-san für kube-vip-VIP) bereitstellen
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"

- name: k3s-Server installieren (cluster-init auf Server-1, Join auf 2/3)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_TOKEN={{ k3s_token }} \
    sh -s - server \
    {{ '--cluster-init' if (k3s_primary | default(false)) else '--server https://192.168.0.160:6443' }}
  args:
    creates: /usr/local/bin/k3s
  become: true
