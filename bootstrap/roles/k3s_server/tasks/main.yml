---
- name: k3s-Server installieren (cluster-init auf Server-1, Join auf 2/3)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_TOKEN={{ k3s_token }} \
    sh -s - server \
    {{ '--cluster-init' if (k3s_primary | default(false)) else '--server https://192.168.0.160:6443' }}
  args:
    creates: /usr/local/bin/k3s
  become: true
