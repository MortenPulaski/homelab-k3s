---
- name: Stop k3s agents
  hosts: k3s_agents
  become: true
  tasks:
    - name: Stop k3s-agent service
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: stopped

- name: Stop k3s servers
  hosts: k3s_servers
  become: true
  tasks:
    - name: Stop k3s service
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped

- name: Power off all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Shutdown node
      community.general.shutdown:
        msg: "Shutdown triggered by Ansible"
