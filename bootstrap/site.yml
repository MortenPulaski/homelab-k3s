---
- name: Prepare all k3s nodes
  hosts: k3s_cluster
  become: true
  roles:
    - prep
  tags: [prep]

- name: Bootstrap first k3s server (cluster-init)
  hosts: srv-1
  become: true
  roles:
    - k3s_server
  tags: [k3s]

- name: Join remaining k3s servers
  hosts: k3s_servers:!srv-1
  become: true
  roles:
    - k3s_server
  tags: [k3s]

- name: Join k3s agents
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent
  tags: [k3s]

- name: Rolling-Restart k3s-Server (tls-san für kube-vip-VIP wirksam machen)
  hosts: k3s_servers
  become: true
  serial: 1
  tags: [kube-vip-restart]
  tasks:
    - name: k3s-Dienst neu starten
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Warten, bis API-Server wieder erreichbar ist
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        delay: 5
        timeout: 120
