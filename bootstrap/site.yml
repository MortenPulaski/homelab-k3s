---
- name: Prepare all k3s nodes
  hosts: k3s_cluster
  become: true
  roles:
    - prep
  tags: [prep]

- name: Bootstrap first k3s server (cluster-init)
  hosts: srv-1
  become: true
  roles:
    - k3s_server
  tags: [k3s]

- name: Join remaining k3s servers
  hosts: k3s_servers:!srv-1
  become: true
  roles:
    - k3s_server
  tags: [k3s]

- name: Join k3s agents
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent
  tags: [k3s]
